global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'server'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['server:8080']

  - job_name: 'llm-service'
    metric_relabel_configs: '/api/metrics'
    static_configs:
      - targets: ['localhost:5000']